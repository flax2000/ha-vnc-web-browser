name: "VNC Web Browser"
version: "0.13.70"
slug: "vnc_web_browser"
description: "Display multiple web pages through VNC"
url: "https://github.com/flax2000/ha-vnc-web-browser"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: true
ports:
  5901/tcp: 5901
  5902/tcp: 5902
  5903/tcp: 5903
  5904/tcp: 5904
  8080/tcp: 8080
ports_description:
  5901/tcp: "VNC port for display 1"
  5902/tcp: "VNC port for display 2"
  5903/tcp: "VNC port for display 3"
  5904/tcp: "VNC port for display 4"
  8080/tcp: "Control Port for Sleep Mode"
schema:
  displays:
    - url: str
      resolution: match(^\d+x\d+$)
      port: int(5900,5910)
      depth: int(8,32)?
      view_only: bool?
      browser_args: str?
      startup_commands: str?
  frame_rate: int(1,60)?
  vnc_password: password?
options:
  displays:
    - url: "http://homeassistant.local:8123"
      resolution: "1280x720"
      port: 5901
      depth: 16
      view_only: false
      browser_args: "--disable-site-isolation-trials --enable-low-end-device-mode"
      startup_commands: "mousemove 150 40 sleep 0.5 click 1 sleep 0.5 click 1"
  frame_rate: 5
  vnc_password: ""
